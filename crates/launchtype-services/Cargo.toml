[package]
name = "launchtype-services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
launchtype-core = { path = "../launchtype-core" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
log.workspace = true
plist = "1"
clipboard-rs = "0.3"
ureq = "2"
base64 = "0.22"
# The bw session key and master password are held in Zeroizing buffers on
# their way to the child process (see bitwarden.rs).
zeroize = { version = "1", features = ["alloc"] }
dirs = "6"
open = "5"
xcap = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
russh = { version = "0.62", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "io-util", "sync"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    # The test tone's sample format (see audio_devices.rs).
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    # Enumerating the shell's Applications folder for `@` mode (see apps.rs).
    "Win32_System_Com",
    # PROPVARIANT, for audio device names and activating an audio client.
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
# `#[interface]` declares IPolicyConfig, which the windows crate has no
# binding for, and the macro expands to paths under `windows_core`.
windows-core = "0.61"

# Listing and switching sound devices, and sounding a test tone through one,
# for `{` and `}` modes (see audio_devices.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString"] }

[dev-dependencies]
tempfile = "3"
